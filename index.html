<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vogliono la notte</title>
  <meta name="description" content="Vogliono la notte, la illumineremo di stelle. Lascia una stella e il tuo pensiero. 20 novembre, sciopero generale.">
  <meta property="og:title" content="Vogliono la notte, la illumineremo di stelle">
  <meta property="og:description" content="Lascia una stella nel cielo e il tuo pensiero. 20 novembre, sciopero generale.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="sky" aria-label="Cielo: clicca o tocca un punto vuoto per lasciare una stella"></main>

  <header class="hud">
    <h1>Vogliono la notte.<br><span>La illumineremo di stelle.</span></h1>
    <p class="meta">20 novembre · sciopero generale · <span id="count">0</span> stelle</p>
  </header>

  <p class="hint" id="hint">Tocca il cielo per lasciare la tua stella</p>

  <!-- Lettura di una stella -->
  <div class="card" id="reader" role="dialog" aria-modal="false" hidden>
    <p class="card-text" id="reader-text"></p>
    <p class="card-name" id="reader-name" hidden></p>
    <p class="card-date" id="reader-date"></p>
    <button type="button" class="danger" id="delete" hidden>Elimina stella</button>
  </div>

  <!-- Barra admin (visibile solo dopo il login) -->
  <div class="adminbar" id="adminbar" hidden>
    Admin · clicca una stella per eliminarla · <button type="button" class="link" id="logout">Esci</button>
  </div>

  <!-- Login admin: si apre visitando la pagina con #admin -->
  <dialog id="login">
    <form id="login-form">
      <label for="password">Password amministratore</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="row">
        <span></span>
        <div class="actions">
          <button type="button" class="ghost" id="login-cancel">Annulla</button>
          <button type="submit">Entra</button>
        </div>
      </div>
      <p class="error" id="login-error" hidden></p>
    </form>
  </dialog>

  <!-- Scrittura di una stella -->
  <dialog id="writer">
    <form method="dialog" id="writer-form">
      <label for="message">Il tuo pensiero sullo sciopero</label>
      <textarea id="message" maxlength="280" rows="4" required
        placeholder="Perché scioperi? Cosa chiedi? Cosa ne pensi?"></textarea>
      <label for="name">Firma <span class="opt">(facoltativa, sarà visibile a tutti)</span></label>
      <input id="name" type="text" maxlength="40" autocomplete="nickname" placeholder="Nome, soprannome o lascia vuoto">
      <input class="hp" id="website" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="row">
        <span id="chars">0/280</span>
        <div class="actions">
          <button type="button" id="cancel" class="ghost">Annulla</button>
          <button type="submit" id="submit">Accendi la stella</button>
        </div>
      </div>
      <p class="error" id="error" hidden></p>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
